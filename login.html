<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Hasan Alamin</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #101B19;
      color: #fff;
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 380px;
      padding: 30px 24px;
      background: #192824;
      border: 1px solid #355447;
      border-radius: 16px;
      text-align: center;
    }

    h2 {
      color: #49A982;
      margin-bottom: 8px;
    }

    p {
      color: #bbb;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-top: 15px;
      border: 1px solid #456457;
      border-radius: 8px;
      background: #101B19;
      color: white;
      font-size: 15px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 20px;
      border: none;
      border-radius: 8px;
      background: #49A982;
      color: #101B19;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .forgot-button {
      margin-top: 12px;
      padding: 8px;
      background: transparent;
      color: #49A982;
      font-size: 14px;
      font-weight: normal;
    }

    #message {
      margin-top: 18px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <h2>HASAN ALAMIN</h2>
    <p>Private Dashboard Login</p>

    <form id="loginForm">

      <input
        type="email"
        id="email"
        placeholder="Email Address"
        autocomplete="username"
        required
      >

      <input
        type="password"
        id="password"
        placeholder="Password"
        autocomplete="current-password"
        required
      >

      <button type="submit" id="loginButton">
        Login
      </button>

    </form>

    <button
      type="button"
      class="forgot-button"
      id="forgotButton"
    >
      Forgot Password?
    </button>

    <p id="message"></p>

  </div>

  <script>
    const SUPABASE_URL =
      "https://rtevxoywkcvbprafkhxr.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_EuPBlIzVy4ztbWnml3KEag_WinN7S5a";

    const supabaseClient = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const loginForm = document.getElementById("loginForm");
    const message = document.getElementById("message");
    const loginButton = document.getElementById("loginButton");
    const forgotButton = document.getElementById("forgotButton");
    const emailInput = document.getElementById("email");

    // LOGIN SYSTEM

    loginForm.addEventListener("submit", async function(event) {
      event.preventDefault();

      const email = emailInput.value.trim();
      const password = document.getElementById("password").value;

      loginButton.disabled = true;
      forgotButton.disabled = true;
      loginButton.textContent = "Checking...";
      message.textContent = "";

      try {
        const { data, error } =
          await supabaseClient.auth.signInWithPassword({
            email,
            password
          });

        if (error) throw error;

        const { data: roleData, error: roleError } =
          await supabaseClient
            .from("user_roles")
            .select("role")
            .eq("user_id", data.user.id)
            .single();

        if (roleError) {
  throw new Error(
    "Role Error: " + roleError.message
  );
}

if (!roleData) {
  throw new Error("No role record found.");
}

        if (roleData.role === "admin") {
          message.style.color = "#49A982";
          message.textContent = "Welcome, Admin!";

          window.location.href = "admin.html";

        } else if (roleData.role === "observer") {
          message.style.color = "#49A982";
          message.textContent = "Welcome, Observer!";

          window.location.href = "observer.html";

        } else {
          throw new Error("Unauthorized account role.");
        }

      } catch (error) {
        await supabaseClient.auth.signOut();

        message.style.color = "#D66B6B";
        message.textContent = error.message;

        loginButton.disabled = false;
        forgotButton.disabled = false;
        loginButton.textContent = "Login";
      }
    });


    // FORGOT PASSWORD SYSTEM

    forgotButton.addEventListener("click", async function() {

      const email = emailInput.value.trim();

      if (!email) {
        message.style.color = "#D66B6B";
        message.textContent =
          "Please enter your email address first.";
        emailInput.focus();
        return;
      }

      forgotButton.disabled = true;
      loginButton.disabled = true;
      forgotButton.textContent = "Sending...";
      message.textContent = "";

      try {
        const { error } =
          await supabaseClient.auth.resetPasswordForEmail(email, {
            redirectTo:
              "https://hasanalamin7.github.io/reset-password.html"
          });

        if (error) throw error;

        message.style.color = "#49A982";
        message.textContent =
          "Password recovery email sent. Please check your inbox.";

      } catch (error) {

        message.style.color = "#D66B6B";
        message.textContent = error.message;

      } finally {

        forgotButton.disabled = false;
        loginButton.disabled = false;
        forgotButton.textContent = "Forgot Password?";

      }
    });

  </script>

</body>
</html>
