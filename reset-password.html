<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | Hasan Alamin</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #101B19;
      color: white;
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    .reset-box {
      width: 100%;
      max-width: 380px;
      padding: 30px 24px;
      background: #192824;
      border: 1px solid #355447;
      border-radius: 16px;
      text-align: center;
    }

    h2 {
      color: #49A982;
      margin-bottom: 10px;
    }

    p {
      color: #bbb;
      font-size: 14px;
      line-height: 1.5;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-top: 15px;
      border: 1px solid #456457;
      border-radius: 8px;
      background: #101B19;
      color: white;
      font-size: 15px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 20px;
      border: none;
      border-radius: 8px;
      background: #49A982;
      color: #101B19;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #message {
      margin-top: 18px;
      line-height: 1.5;
    }

    a {
      color: #49A982;
    }
  </style>
</head>

<body>

  <div class="reset-box">

    <h2>HASAN ALAMIN</h2>

    <p>Set Your New Password</p>

    <form id="resetForm">

      <input
        type="password"
        id="newPassword"
        placeholder="New Password"
        minlength="8"
        autocomplete="new-password"
        required
        disabled
      >

      <input
        type="password"
        id="confirmPassword"
        placeholder="Confirm New Password"
        minlength="8"
        autocomplete="new-password"
        required
        disabled
      >

      <button type="submit" id="resetButton" disabled>
        Update Password
      </button>

    </form>

    <p id="message">Verifying recovery link...</p>

  </div>

  <script>
    const SUPABASE_URL =
      "https://rtevxoywkcvbprafkhxr.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_EuPBlIzVy4ztbWnml3KEag_WinN7S5a";

    const supabaseClient = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY,
      {
        auth: {
          flowType: "pkce",
          detectSessionInUrl: false,
          persistSession: true,
          autoRefreshToken: true
        }
      }
    );

    const resetForm =
      document.getElementById("resetForm");

    const message =
      document.getElementById("message");

    const resetButton =
      document.getElementById("resetButton");

    const newPasswordInput =
      document.getElementById("newPassword");

    const confirmPasswordInput =
      document.getElementById("confirmPassword");

    let recoveryReady = false;
    let passwordUpdating = false;

    function showError(text) {
      recoveryReady = false;

      message.style.color = "#D66B6B";
      message.textContent = text;

      newPasswordInput.disabled = true;
      confirmPasswordInput.disabled = true;
      resetButton.disabled = true;
    }

    function enablePasswordForm() {
      recoveryReady = true;

      message.style.color = "#49A982";
      message.textContent =
        "Recovery verified. Set your new password.";

      newPasswordInput.disabled = false;
      confirmPasswordInput.disabled = false;
      resetButton.disabled = false;
    }

    // Verify and establish the recovery session
    async function checkRecoverySession() {
      try {
        const currentURL =
          new URL(window.location.href);

        const hashParams =
          new URLSearchParams(
            currentURL.hash.substring(1)
          );

        const queryParams =
          currentURL.searchParams;

        const urlError =
          queryParams.get("error_description") ||
          hashParams.get("error_description") ||
          queryParams.get("error") ||
          hashParams.get("error");

        if (urlError) {
          throw new Error(
            "Recovery link error: " + urlError
          );
        }

        let session = null;

        const accessToken =
          hashParams.get("access_token");

        const refreshToken =
          hashParams.get("refresh_token");

        const recoveryType =
          hashParams.get("type");

        const code =
          queryParams.get("code");

        // Handle recovery links containing access and refresh tokens
        if (
          recoveryType === "recovery" &&
          accessToken &&
          refreshToken
        ) {
          const { data, error } =
            await supabaseClient.auth.setSession({
              access_token: accessToken,
              refresh_token: refreshToken
            });

          if (error) throw error;

          session = data.session;

        } else if (code) {

          // Handle PKCE recovery links
          const { data, error } =
            await supabaseClient.auth.exchangeCodeForSession(
              code
            );

          if (error) throw error;

          session = data.session;

        } else {
          throw new Error(
            "Recovery link সঠিক নয় অথবা মেয়াদ শেষ হয়েছে। নতুন Reset Password ইমেইল পাঠাও।"
          );
        }

        if (!session) {
          throw new Error(
            "Recovery session তৈরি করা যায়নি।"
          );
        }

        // Remove sensitive tokens from the address bar
        window.history.replaceState(
          {},
          document.title,
          window.location.pathname
        );

        enablePasswordForm();

      } catch (error) {
        showError(error.message);
      }
    }

    // Update password
    resetForm.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();

        if (!recoveryReady || passwordUpdating) {
          return;
        }

        const newPassword =
          newPasswordInput.value;

        const confirmPassword =
          confirmPasswordInput.value;

        if (newPassword.length < 8) {
          message.style.color = "#D66B6B";
          message.textContent =
            "Password must contain at least 8 characters.";
          return;
        }

        if (newPassword !== confirmPassword) {
          message.style.color = "#D66B6B";
          message.textContent =
            "Passwords do not match.";
          return;
        }

        passwordUpdating = true;

        resetButton.disabled = true;
        resetButton.textContent = "Updating...";

        try {
          const { error } =
            await supabaseClient.auth.updateUser({
              password: newPassword
            });

          if (error) throw error;

          recoveryReady = false;

          await supabaseClient.auth.signOut();

          resetForm.reset();

          message.style.color = "#49A982";
          message.textContent =
            "Password updated successfully! You can now login.";

          const loginLink =
            document.createElement("a");

          loginLink.href = "login.html";
          loginLink.textContent = "Go to Login";

          message.appendChild(
            document.createElement("br")
          );

          message.appendChild(loginLink);

        } catch (error) {
          message.style.color = "#D66B6B";
          message.textContent =
            "Password update error: " + error.message;

          resetButton.disabled = false;
          resetButton.textContent = "Update Password";

          passwordUpdating = false;
        }
      }
    );

    checkRecoverySession();

  </script>

</body>
</html>
